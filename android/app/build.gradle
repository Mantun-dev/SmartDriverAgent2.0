plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}
// apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 35 // Incrementar la versión a 33 o a la más alta que sea compatible con tus dependencias
    ndkVersion = "28.0.12916984"
    buildFeatures {
        buildConfig true
    }
    
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        warningsAsErrors true
        disable 'InvalidPackage'
        checkReleaseBuilds true
        abortOnError true
        lintConfig file("$project.rootDir/gradle/lint.xml")
        warning 'deprecation'
    }

    defaultConfig {
        applicationId "com.smartdriver.devs"
        namespace "com.smartdriver.devs"
        minSdkVersion 26
        targetSdkVersion 35// Incrementar la versión a 33 o a la más alta que sea compatible con tus dependencias
        multiDexEnabled true // Habilitar el soporte multidex
        versionCode 161
        versionName "2.9.54"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // ndk {
        //     abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        // }
    }

    packagingOptions {
        // Add these lines to handle 16KB page size issue
        jniLibs {
            useLegacyPackaging = true
        }
        // Exclude problematic libraries if needed
        // exclude 'lib/x86_64/libandroidlame.so'
        // exclude 'lib/x86_64/libucrop.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17' // Ensure Kotlin compiles to JVM 17 bytecode
    }
    // Define keystoreProperties y carga las propiedades del archivo key.properties
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        debug {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0" // Puedes probar 'kotlin-stdlib' sin jdk7 si hay problemas
    // ACTUALIZADO: Versión de Firebase BOM. Asegúrate de que esta sea la última.
    // La 28.1.0 es MUY antigua. Debes usar la más reciente, por ejemplo 32.x.x
    implementation platform('com.google.firebase:firebase-bom:32.8.0') // <--- ACTULIZA ESTO
    implementation 'com.google.firebase:firebase-analytics-ktx'

    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:review:2.0.1'
    implementation "com.google.android.play:asset-delivery:2.2.2"
    implementation "com.google.android.play:feature-delivery:2.1.0"
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // implementation platform('com.google.firebase:firebase-bom:32.8.0') // <--- ACTULIZA ESTO
    // implementation "androidx.multidex:multidex:2.0.1"
    // implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // testImplementation 'junit:junit:4.13.2'
    // androidTestImplementation 'androidx.test:runner:1.4.0'
    // androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    // implementation 'com.google.firebase:firebase-analytics:19.0.2'
    // implementation 'com.google.firebase:firebase-messaging:23.0.0'
    // implementation 'com.google.android.gms:play-services-base:17.6.0'
    // implementation 'com.google.android.gms:play-services-tasks:17.0.0'    
    // // Agregar aquí otras dependencias de tu proyecto


    // implementation 'com.google.android.play:app-update:2.1.0'

    // implementation 'com.google.android.play:review:2.0.1'

    // implementation "com.google.android.play:asset-delivery:2.2.2"
    // implementation "com.google.android.play:feature-delivery:2.1.0"
}
configurations {
  configureEach {
      exclude group: 'com.google.android.play', module: 'core'
      exclude group: 'androidx.media3', module: 'media3-exoplayer-rtsp'
  }
}
